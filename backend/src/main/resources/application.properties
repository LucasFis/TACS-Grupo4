logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE

# Con esto la clases del dominio se mapean a json con snake case en lugar de camel case
spring.jackson.property-naming-strategy=SNAKE_CASE

spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/tacs}
spring.data.mongodb.replica-set-name=${MONGO_REPLICA_SET_NAME:}
spring.data.mongodb.auto-index-creation=true

cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}

# TheSportsDB
thesportsdb.base-url=https://www.thesportsdb.com/api/v1/json
thesportsdb.api-key=123
thesportsdb.rpm=30
thesportsdb.retry.max-attempts=3
thesportsdb.retry.wait-seconds=60

jwt.secret=${JWT_SECRET:secreto-super-secretoso-no-usar-en-prod-solo-dev}
jwt.expiration=${JWT_EXPIRATION:12h}

# El agente de OpenTelemetry ya exporta JVM, process, system y HTTP server. Apagamos
# esas familias en Micrometer para que el OtlpMeterRegistry no las re-exporte (evita la
# duplicacion: http_server_request_duration_seconds del agente vs http_server_requests_*
# de Micrometer). Micrometer queda como fuente unica de lo que el agente NO ve: negocio
# (propuestas_*, subastas_*, etc.), resilience4j y el executor @Async (executor_*).
management.metrics.enable.jvm=false
management.metrics.enable.process=false
management.metrics.enable.system=false
management.metrics.enable.http=false
management.endpoints.web.exposure.include=
